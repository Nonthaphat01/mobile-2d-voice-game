'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let W=0,H=0,last=performance.now(),vx=0,vy=0,joyPointer=null;function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
const world={w:780,h:550},objects=[{x:125,y:95,w:130,h:68,t:'sofa'},{x:310,y:120,w:140,h:80,t:'table'},{x:570,y:95,w:105,h:105,t:'plant'},{x:120,y:370,w:120,h:75,t:'bed'},{x:555,y:370,w:115,h:70,t:'cabinet'},{x:475,y:120,w:65,h:65,t:'chair'}];const me={x:390,y:310,face:0,name:'ผู้เล่น',text:'',until:0,color:'#527bea',pose:'stand',furniture:null,walking:false};const others=new Map(),connections=new Map(),calls=new Map(),audios=new Map();let peer=null,myId='',hostId='',roomCode='',isHost=false,localStream=null,recognition=null,recStop=false,speakerOn=true,analyser=null,audioCtx=null,frame=0,lastVoiceSignal=0,voiceActive=false;const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
function toast(t){$('toast').textContent=t}function status(){const n=1+others.size;$('count').textContent='ออนไลน์ '+n+' คน';$('state').textContent=roomCode?'ห้อง '+roomCode+(isHost?' (เจ้าของห้อง)':''):'ยังไม่ได้เข้าห้อง'}function color(id){let n=0;for(const c of id)n=(n*31+c.charCodeAt(0))>>>0;return ['#527bea','#e27a89','#6fbd84','#c49a55','#aa80d6','#61b7c2'][n%6]}
function cleanName(t){return String(t||'ผู้เล่น').trim().slice(0,14)||'ผู้เล่น'}function code(t){return String(t||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24)}function idForRoom(c){return 'thai2droom-'+c}function rand(){return Math.random().toString(36).slice(2,8)}

function removePeer(id){connections.delete(id);others.delete(id);calls.get(id)?.close();calls.delete(id);audios.get(id)?.remove();audios.delete(id);status();if(id===hostId&&!isHost)toast('เจ้าของห้องออกแล้ว ผู้เล่นที่เชื่อมต่อกันอาจยังคุยต่อได้')}function closeAll(){for(const c of connections.values())c.close();connections.clear();for(const c of calls.values())c.close();calls.clear();for(const a of audios.values())a.remove();audios.clear();others.clear();if(peer){peer.destroy();peer=null}hostId='';roomCode='';isHost=false;status()}
function initPeer(requested,host){closeAll();isHost=host;peer=new Peer(requested||undefined,{debug:0});peer.on('open',id=>{myId=id;if(host){hostId=id;roomCode=requested.replace('thai2droom-','');history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(roomCode));toast('ห้องพร้อมแล้ว! กดคัดลอกลิงก์เพื่อชวนเพื่อน')}else{roomCode=code($('room').value);hostId=idForRoom(roomCode);connectTo(hostId);toast('กำลังเข้าห้อง '+roomCode)}status()});peer.on('connection',c=>{attach(c);if(isHost){setTimeout(()=>broadcast({type:'roster',ids:[...connections.keys()]}),700)}});peer.on('call',call=>{calls.get(call.peer)?.close();calls.set(call.peer,call);try{call.answer(localStream||undefined)}catch(e){toast('รับสายเสียงไม่สำเร็จ')}wireCall(call)});peer.on('error',e=>{toast('เชื่อมต่อไม่สำเร็จ: '+(e.type==='unavailable-id'?'รหัสห้องถูกใช้แล้ว':e.type));if(e.type==='peer-unavailable')toast('ไม่พบห้องนี้ ตรวจสอบรหัสหรือให้เจ้าของห้องออนไลน์')});peer.on('disconnected',()=>toast('การเชื่อมต่อขาดชั่วคราว กำลังลองเชื่อมใหม่'));}

function say(t,final=true){t=String(t||'').trim().slice(0,120);if(!t)return;me.text=t;me.until=Date.now()+5000;broadcast({type:'caption',text:t});if(final)toast('💬 '+t)}$('chat').onsubmit=e=>{e.preventDefault();say($('input').value);$('input').value='';$('input').blur()};
const joy=$('joy'),stick=$('stick');function moveJoy(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,lim=(r.width-62)/2,len=Math.hypot(dx,dy)||1,k=Math.min(1,lim/len);vx=dx*k/lim;vy=dy*k/lim;stick.style.transform=`translate(${dx*k}px,${dy*k}px)`}joy.addEventListener('pointerdown',e=>{if(joyPointer!==null)return;joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)moveJoy(e)});for(const type of ['pointerup','pointercancel','lostpointercapture'])joy.addEventListener(type,e=>{if(e.pointerId===joyPointer){joyPointer=null;vx=vy=0;stick.style.transform=''}});const keys=new Set();const movementKeys=new Set(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);function movementKey(e){return e.key.startsWith('Arrow')?e.key:e.key.toLowerCase()}addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;const k=movementKey(e);if(movementKeys.has(k)){keys.add(k);e.preventDefault()}});addEventListener('keyup',e=>{const k=movementKey(e);if(movementKeys.has(k)){keys.delete(k);e.preventDefault()}});addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>{if(document.hidden)keys.clear()});const activatables=new Set(['bed','sofa','chair']);

function useFurniture(o){

function rect(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}

function avatar(p){
 const pose=p.pose||'stand';
 const speaking=p===me?voiceActive:!!p.talking&&(Date.now()-(p.voiceSeen||0)<1600);
 const now=performance.now();const walk=pose==='stand'&&p.walking?Math.sin(now/95)*2.4:0;
 ctx.save();ctx.translate(p.x,p.y);
 ctx.fillStyle='#0d243533';ctx.beginPath();ctx.ellipse(1,19,19,7,0,0,Math.PI*2);ctx.fill();
 if(pose==='sleep'){
   const breath=Math.sin(now/620)*1.5;
   // Lying horizontally with the head on the pillow and feet toward the bottom of the bed.
   rect(-16,-13,47+breath,27,10,p.color);
   rect(-31,-13,23,26,10,'#f6cda7');
   ctx.strokeStyle='#583b39';ctx.lineWidth=1.9;
   for(const yy of [-5,6]){ctx.beginPath();ctx.moveTo(-24,yy);ctx.lineTo(-18,yy);ctx.stroke()}

   ctx.font='18px system-ui';ctx.textAlign='center';ctx.fillText('💤',36,-24+Math.sin(now/550)*2);
 }else{
   if(pose==='sit'){
    rect(-19,5,38,15,6,'#304865');rect(-19,16,13,10,5,p.color);rect(6,16,13,10,5,p.color);
   }else{
    rect(-14,1+walk,12,18,5,'#344e72');rect(2,1-walk,12,18,5,'#344e72');
   }
   rect(-16,-9+walk,32,24,11,p.color);
   circle(0,-13+walk,12,'#f6cda7');
   circle(-5,-16+walk,1.9,'#26313e');circle(5,-16+walk,1.9,'#26313e');
   if(speaking){circle(0,-7+walk,3+Math.abs(Math.sin(now/85))*2,'#aa4660')}
   else{ctx.strokeStyle='#98485a';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(-3,-7+walk);ctx.quadraticCurveTo(0,-5+walk,3,-7+walk);ctx.stroke()}
 }
 ctx.restore();
 ctx.textAlign='center';ctx.font='bold 12px system-ui';
 const nametag=cleanName(p.name);const nw=Math.max(58,Math.min(130,ctx.measureText(nametag).width+22));
 rect(p.x-nw/2,p.y-53,nw,21,10,'#ffffffec');ctx.fillStyle='#213044';ctx.fillText(nametag,p.x,p.y-38);

 if(p.text&&p.until>Date.now()){

  if(line)lines.push(line);lines=lines.slice(-4);

 }
}
function drawDecor(now){

 // Window: moving clouds and a cozy animated glow.
 rect(510,30,195,55,9,'#5b7d8c');rect(516,36,183,43,6,'#83c8d1');

 rect(605+Math.sin(t/8)*15,46,59,10,8,'#e5f6f1aa');

 // Rug and woven rug pattern.

 // Paintings and a clock on the wall.

 circle(125,46,7,'#f5de84');ctx.fillStyle='#709e7b';ctx.beginPath();ctx.moveTo(101,68);ctx.lineTo(133,47);ctx.lineTo(163,68);ctx.fill();
 circle(393,54,20,'#faf5df');circle(393,54,16,'#c9dfea');
 ctx.save();ctx.translate(393,54);ctx.rotate(t/60);rect(-1,-12,2,12,1,'#57677b');ctx.restore();
 ctx.save();ctx.translate(393,54);ctx.rotate(t/5);rect(-1,-14,2,14,1,'#57677b');ctx.restore();
 // Floating dust motes for an animated, lived-in scene.
 for(let i=0;i<15;i++){const x=65+(i*139)%655+Math.sin(t*.7+i)*7,y=85+(i*71)%390+Math.cos(t*.6+i)*7;circle(x,y,1.2+Math.sin(t+i)*.3,'#fff8d875')}
}
function drawFurniture(o,now){

function drawCat(now){
 const t=now/1000;const x=550+Math.sin(t*.7)*27,y=293+Math.cos(t*.7)*17;
 ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*.7)*.18);
 circle(0,0,12,'#efb981');circle(-8,-8,6,'#efb981');circle(8,-8,6,'#efb981');
 circle(-4,-1,1.5,'#584c45');circle(4,-1,1.5,'#584c45');circle(0,4,2,'#a35b64');
 ctx.strokeStyle='#db976b';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(9,8);ctx.quadraticCurveTo(22+Math.sin(t*3)*6,14,18,0);ctx.stroke();ctx.restore();
}
function drawRoom(now){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#122036';ctx.fillRect(0,0,W,H);
 const scale=Math.min((W-16)/world.w,(H-16)/world.h,1.25),ox=(W-world.w*scale)/2,oy=(H-world.h*scale)/2;
 ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
 rect(0,0,780,550,18,'#a8bec5');rect(24,24,732,502,10,'#d9c6a7');
 ctx.strokeStyle='#bda98a';ctx.lineWidth=1;
 for(let x=40;x<740;x+=40){ctx.beginPath();ctx.moveTo(x,26);ctx.lineTo(x,524);ctx.stroke()}
 for(let y=40;y<510;y+=40){ctx.beginPath();ctx.moveTo(26,y);ctx.lineTo(754,y);ctx.stroke()}
 drawDecor(now);
 for(const o of objects)drawFurniture(o,now);
 drawCat(now);
 for(const p of others.values())avatar(p);
 avatar(me);
 ctx.restore();
}
let lastSend=0;
function render(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 let dx=vx,dy=vy;
 if(keys.size){dx=Number(keys.has('d')||keys.has('ArrowRight'))-Number(keys.has('a')||keys.has('ArrowLeft'));dy=Number(keys.has('s')||keys.has('ArrowDown'))-Number(keys.has('w')||keys.has('ArrowUp'))}
 const length=Math.hypot(dx,dy);if(length>1){dx/=length;dy/=length}
 me.walking=false;
 if(length>.08&&me.pose==='stand'){
   me.face=Math.atan2(dy,dx);const nx=me.x+dx*175*dt,ny=me.y+dy*175*dt;
   const colliding=objectAt(nx,ny);
   if(colliding&&useFurniture(colliding)){
     // Interaction starts by bumping into the bed/sofa/chair.
   }else{
     const px=me.x,py=me.y;
     if(!hit(nx,me.y))me.x=nx;
     if(!hit(me.x,ny))me.y=ny;
     me.walking=Math.hypot(me.x-px,me.y-py)>.1;
   }
 }
 if(now-lastSend>90&&roomCode){broadcast(snapshot());lastSend=now}
 drawRoom(now);requestAnimationFrame(render);
}
requestAnimationFrame(render);
function wireCall(call){call.on('stream',s=>{let a=audios.get(call.peer);if(!a){a=document.createElement('audio');a.autoplay=true;a.playsInline=true;document.body.appendChild(a);audios.set(call.peer,a)}a.srcObject=s;a.muted=!speakerOn;a.play().catch(()=>toast('แตะ 🔊 เพื่ออนุญาตเล่นเสียง'))});call.on('close',()=>{calls.delete(call.peer);audios.get(call.peer)?.remove();audios.delete(call.peer)});call.on('error',()=>toast('เสียงบางคนเชื่อมต่อไม่ได้'))}function callPeer(id){if(!localStream||!connections.get(id)?.open||!peer)return;calls.get(id)?.close();const c=peer.call(id,localStream);if(c){calls.set(id,c);wireCall(c)}}
$('speaker').onclick=()=>{speakerOn=!speakerOn;$('speaker').textContent=speakerOn?'🔊':'🔇';for(const a of audios.values()){a.muted=!speakerOn;if(speakerOn)a.play().catch(()=>{})}};
const bars=Array.from({length:9},()=>{const b=document.createElement('i');$('wave').appendChild(b);return b});function drawWave(){if(!localStream||!analyser)return;const data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);let v=0;for(const n of data)v+=((n-128)/128)**2;const amp=Math.sqrt(v/data.length);const active=amp>0.035;if(active!==voiceActive){voiceActive=active;broadcast({type:'voice',active})}if(performance.now()-lastVoiceSignal>700){broadcast({type:'voice',active:voiceActive});lastVoiceSignal=performance.now()}bars.forEach((b,i)=>b.style.height=Math.max(5,Math.min(23,5+amp*180*(.5+.5*Math.sin(i+performance.now()/160))))+'px');frame=requestAnimationFrame(drawWave)}
function startRecognition(){if(!SpeechRecognition){toast('เบราว์เซอร์นี้ไม่รองรับแปลงเสียงเป็นข้อความ แต่ยังพูดคุยได้');return}recStop=false;const rec=new SpeechRecognition();recognition=rec;rec.lang='th-TH';rec.continuous=true;rec.interimResults=true;let lastCaption='';rec.onresult=e=>{let interim='',final='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else interim+=t}const t=(final||interim).trim();if(t&&t!==lastCaption){lastCaption=t;say(t,false)}};rec.onend=()=>{if(localStream&&!recStop&&recognition===rec)try{rec.start()}catch(e){}};rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('ระบบแปลงเสียงไม่ได้รับอนุญาต แต่ไมค์ยังส่งเสียงได้')};try{rec.start()}catch(e){toast('แปลงเสียงไม่พร้อม แต่ไมค์ยังทำงาน')}}
async function stopMic(){recStop=true;try{recognition?.stop()}catch(e){}recognition=null;cancelAnimationFrame(frame);for(const c of calls.values())c.close();calls.clear();if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}analyser=null;voiceActive=false;broadcast({type:'voice',active:false});$('mic').classList.remove('on');$('mic').textContent='🎤';bars.forEach(b=>b.style.height='5px');toast('ปิดไมค์แล้ว')}
$('mic').onclick=async()=>{if(localStream){await stopMic();return}try{if(!window.isSecureContext)throw Error('ต้องเปิดผ่าน HTTPS');localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});$('mic').classList.add('on');$('mic').textContent='🔴';audioCtx=new (window.AudioContext||window.webkitAudioContext)();const source=audioCtx.createMediaStreamSource(localStream);analyser=audioCtx.createAnalyser();analyser.fftSize=512;source.connect(analyser);drawWave();for(const id of connections.keys())callPeer(id);startRecognition();toast('เปิดไมค์แล้ว • เพื่อนจะได้ยินเสียงและเห็นข้อความ')}catch(e){toast('เปิดไมค์ไม่ได้: '+(e.message||e.name))}};
addEventListener('pagehide',()=>{if(localStream)stopMic();peer?.destroy()});
