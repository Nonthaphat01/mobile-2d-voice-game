function townTick(now,dt){
 const players=[me,...[...others.values()].filter(p=>p.scene==='outside')];
 neighbors.forEach((npc,index)=>{
   const conversing=lifeTarget===npc&&lifeDialog.open;
   const [x,y]=npc.route[npc.target];
   const dx=x-npc.x,dy=y-npc.y,distance=Math.hypot(dx,dy);
   const stride=Math.min(distance,dt*townSpeeds[index%townSpeeds.length]);
   let nearest=null,closest=94;
   for(const player of players){
     const gap=Math.hypot(player.x-npc.x,player.y-npc.y);
     if(gap<closest){nearest=player;closest=gap}
   }
   const nearMe=nearest===me;
   if(!npc.inRange&&nearMe&&npc.personality==='social'&&now>npc.greetAfter){
     npc.text=townGreetings[Math.floor(Math.random()*townGreetings.length)];
     npc.until=Date.now()+3800;
     npc.greetAfter=now+17000;
   }
   npc.inRange=nearMe;
   const looking=conversing||nearest&&(npc.personality!=='quiet'||closest<42);
   npc.walking=!conversing&&!(nearest&&closest<69&&npc.personality==='social');
   if(npc.walking&&distance>0){npc.x+=dx*stride/distance;npc.y+=dy*stride/distance}
   if(stride>=distance)npc.target=(npc.target+1)%npc.route.length;
   const lookAt=conversing?me:nearest;
   const direction=looking?Math.atan2(lookAt.y-npc.y,lookAt.x-npc.x):Math.atan2(dy,dx);
   const turn=Math.atan2(Math.sin(direction-npc.face),Math.cos(direction-npc.face));
   npc.face+=turn*Math.min(1,dt*9);
 });
}

function beginActivity(kind,item,message,finish,face){
 if(me.action||me.pose!=='stand')return;
 me.action={kind,item,started:performance.now(),duration:activityTimes[kind]};
 if(Number.isFinite(face))me.face=face;
 completeActivity=finish;
 me.walking=false;
 keys.clear();
 stopMineHold();
 clearInterval(mineSpaceInterval);
 if(lifeDialog.open)lifeDialog.close();
 toast(message);
 broadcast(snapshot());
}

function tickActivity(now){
 const action=me.action;
 if(!action||now-action.started<action.duration)return;
 const finish=completeActivity;
 completeActivity=null;
 me.action=null;
 finish();
 saveLife();
 lifeHud();
 broadcast(snapshot());
}

function activitySnapshot(){
 const action=me.action;
 if(!action)return null;
 return {kind:action.kind,item:action.item,remaining:Math.max(0,Math.round(action.started+action.duration-performance.now()))};
}

function readActivity(player,data){
 if(!data||!Object.hasOwn(activityTimes,data.kind)||!Object.hasOwn(foods,data.item)){
   player.action=null;
   return;
 }
 const duration=activityTimes[data.kind];
 if(!Number.isFinite(data.remaining)||data.remaining<=0||data.remaining>duration){
   player.action=null;
   return;
 }
 const started=performance.now()+data.remaining-duration;
 if(player.action?.kind===data.kind&&player.action.item===data.item&&Math.abs(player.action.started-started)<250)return;
 player.action={kind:data.kind,item:data.item,started,duration};
}

function nearGarden(){

 const label=status===0?'ปลูกมะเขือเทศ':status===1?'รดน้ำ':'เก็บมะเขือเทศ';

function drawGarden(now){

 mapLabel('แปลงมะเขือเทศ',490,353,'#263f30');
 for(const {id,x,y} of gardenPlots){
   const status=life.garden[id];

   rect(x-24,y-16,48,37,7,'#4a472e58');
   rect(x-24,y-20,48,36,7,'#ab794a');

   const stem=10+growth*21;

   ctx.strokeStyle='#387345';ctx.lineWidth=3;
   ctx.beginPath();ctx.moveTo(x,y+4);ctx.quadraticCurveTo(x-2,y-stem/2,x+sway,y-stem);ctx.stroke();

   circle(x+5+growth*6,y-stem*.74,3+growth*4,'#65a755');
   circle(x+sway,y-stem,4+growth*3,'#7cb55c');
   if(wet){
     const width=36*(growth-.3)/.7;
     rect(x-18,y+19,36,4,2,'#d1c7a6');rect(x-18,y+19,width,4,2,'#4da1ae');
   }

   }
 }
}

   }

   const chewing=motion?.kind==='eat'&&motion.phase>.26;
   if(speaking||chewing)shapeEllipse(c,gazeX,7.5,2.1+Math.abs(Math.sin(now/83)),1.3+Math.abs(Math.sin(now/75))*1.2,'#91485a');
   else shapeLine(c,[[gazeX-2,7],[gazeX,8],[gazeX+2,7]],'#975d5b',1.25);
   if(a.accessory===1){
     for(const offset of [-5,5]){
       if(side>.8&&Math.sign(offset)!==Math.sign(lookX))continue;
       c.beginPath();c.roundRect(gazeX+offset-4,-2,8,6,2);
       c.strokeStyle='#3f5063';c.lineWidth=1.3;c.stroke();
     }
     if(side<.8)shapeLine(c,[[gazeX-1,0],[gazeX+1,0]],'#3f5063',1.1);
   }
 }
 if(a.style===2){
   for(let i=0;i<9;i++){
     const theta=Math.PI+i*Math.PI/8;
     const x=Math.cos(theta)*11,y=-5+Math.sin(theta)*9;
     shapeEllipse(c,x,y,4.7,5.4,hairFill);
     shapeEllipse(c,x-.9,y-1.6,1.8,1.2,hair[0],.42);
   }
 }else{
   c.beginPath();c.moveTo(-13,-2);c.bezierCurveTo(-18,-19,13,-24,14,-6);
   c.quadraticCurveTo(12,-5,12,-1);c.quadraticCurveTo(8,-7,3,-9);
   c.quadraticCurveTo(-4,-2,-13,-2);c.fillStyle=hairFill;c.fill();
   c.beginPath();c.moveTo(-11,-9);c.quadraticCurveTo(-4,-17,5,-13);
   c.strokeStyle=hair[0];c.lineWidth=1.7;c.lineCap='round';c.stroke();
 }
 if(a.style===3){
   shapeEllipse(c,8,-15,6.7,5.4,hair[2],.5);
   shapeEllipse(c,7,-17,3.5,2.1,hair[0],.6);
   shapeEllipse(c,7,-13,4.2,1.2,shirt[0],-.1);
 }
 if(a.accessory===2){
   shapeEllipse(c,-.5,-13,14,5.6,shirt[2]);
   shapeEllipse(c,-1.6,-15,12,5,lightGradient(c,-10,-18,12,-11,shirt));
   if(!back)shapeEllipse(c,lookX*4,-9,12.5,3.4,shirt[0],lookX*.12);
   shapeEllipse(c,-1.5,-19,2.2,1.2,shirt[0]);
 }
 c.restore();
}
function drawHeldProp(c,motion,x,y,now){
 if(motion.kind==='cook'){
   shapeEllipse(c,x+1,y+1,11,5,'#263f46');
   shapeEllipse(c,x+1,y,9.6,4,'#586e6e');
   shapeEllipse(c,x+1,y-.4,6.2,2.5,'#fbcf72');
   shapeLine(c,[[x+8,y],[x+15,y-2]],'#353c41',3);
   shapeLine(c,[[x-8,y-9],[x+motion.beat*6,y-.8]],'#a47954',2.8);
   for(let i=0;i<3;i++){
     const ascent=((now/1450)+i/3)%1;
     shapeEllipse(c,x-6+i*6+Math.sin(ascent*5+i)*2,y-6-ascent*11,1.1+ascent,1.7+ascent,'rgba(245,255,226,'+(.8-ascent*.8)+')');
   }
 }else if(motion.kind==='eat'){
   const held=motion.item==='sandwich';
   if(held){
     shapeRound(c,x-5,y-3,10,7,2,'#ce8746');
     shapeRound(c,x-4.5,y-2,9,3,1,'#ffe7a4');
     shapeLine(c,[[x-4,y+1],[x+4,y+1]],'#83a24a',1.6);
   }else{
     shapeLine(c,[[x+4,y+6],[x-2,y-3]],'#d0e2e0',2.3);
     shapeEllipse(c,x-2,y-3,3.4,2.4,'#eec27c');
   }
 }else if(motion.kind==='water'){
   shapeRound(c,x-6,y-4,13,9,2,'#65c5c8');
   shapeLine(c,[[x+4,y+1],[x+11,y+2],[x+14,y+6]],'#3b8d9f',2.8);
   c.beginPath();c.arc(x-4,y-3,4,Math.PI,Math.PI*1.85);c.strokeStyle='#296a78';c.lineWidth=2;c.stroke();
   for(let i=0;i<3;i++){
     const drip=((now/390)+i/3)%1;
     shapeEllipse(c,x+14+drip*7,y+7+drip*9,1,1.5,'#b4edf3');
   }
 }else{
   shapeLine(c,[[x-1,y-7],[x+4,y+1]],'#ba8a59',2.8);
   shapeEllipse(c,x+4,y+3,3.2,5.1,'#c0d8d6',-.52);
   shapeEllipse(c,x+3,y+3,1.5,2.8,'#dae9df',-.52);
 }
}
function paintCharacter(c,p,now,speaking=false){
 const a=characterAppearance(p);
 const skin=skinTones[a.skin],hair=hairTones[a.hair],shirt=outfitTones[a.outfit];
 const motion=activityPose(p.action,now);
 const lookX=Math.cos(Number.isFinite(p.face)?p.face:Math.PI/2);
 const lookY=Math.sin(Number.isFinite(p.face)?p.face:Math.PI/2);
 const stride=p.walking&&!motion?Math.sin(now/96):0;
 const seated=p.pose==='sit';
 const shirtWidth=a.gender===0?31:a.gender===1?26:29;
 shapeEllipse(c,2,18,19,6,'#13243730');
 shapeEllipse(c,1,16,12,4,'#17263d38');
 if(p.pose==='sleep'){drawSleeper(c,skin,hair,shirt,now);return}
 c.save();c.translate(0,Math.abs(stride)*-1.45+(seated?5:0));
 const bend=motion&&['plant','harvest','water'].includes(motion.kind);
 if(bend)c.translate(2+motion.beat,3);
 for(const side of [-1,1]){
   const footX=side*6.4+side*stride*lookX*2.4, footY=13+side*stride*4.5;
   shapeRound(c,footX-4.3,seated?3:1,8.7,seated?8:footY-1,3,side<0?'#53647c':'#34465e');
   shapeRound(c,footX-5.3,footY-2,10.6,5.8,2.3,'#2e3c50');
   shapeRound(c,footX-4.8,footY+.9,9.6,2,1,shirt[0]);
 }
 const shirtFill=lightGradient(c,-13,-13,12,6,shirt);
 shapeRound(c,-shirtWidth/2,-16,shirtWidth,25,9,shirtFill);
 shapeLine(c,[[-shirtWidth/2+5,5],[0,6],[shirtWidth/2-5,5]],shirt[2],1.5);
 shapeRound(c,-5,-20,10,7,3,skin[2]);
 shapeLine(c,[[-5,-15],[0,-11],[5,-15]],shirt[0],1.4);
 if(lookY>-.65)shapeRound(c,3,-7,5,5,1.4,shirt[0]);
 let heldX=13,heldY=-2;
 for(const side of [-1,1]){
   const shoulderX=side*(shirtWidth/2-2);
   let handX=side*(shirtWidth/2+1)+stride*side*2.3,handY=side*stride*3;
   if(motion?.kind==='eat'&&side===1){
     const lift=Math.min(1,motion.phase*4);
     handX=14-lift*(11+motion.beat);
     handY=-1-lift*(15+motion.beat*2);
   }else if(motion?.kind==='cook'){
     handX=side===1?14+motion.beat*2:-8-motion.beat*3;
     handY=side===1?-4:-8-motion.beat*2;
   }else if(bend&&side===1){
     handX=15+motion.beat*3;handY=5+motion.beat*2;
   }
   shapeLine(c,[[shoulderX,-12],[shoulderX+side*1.4,-5],[handX,handY]],shirt[2],7.5);
   shapeLine(c,[[shoulderX-.8,-12],[shoulderX+side*.7,-6]],shirt[0],3.4);
   shapeEllipse(c,handX,handY,3.5,3.7,lightGradient(c,handX-2,handY-3,handX+2,handY+2,skin));
   if(side===1){heldX=handX;heldY=handY}
 }
 drawHead(c,lookX,lookY,a,skin,hair,shirt,speaking,motion,now);
 if(motion)drawHeldProp(c,motion,heldX,heldY,now);
 else if(p.inMine){
   c.save();c.translate(heldX,heldY);c.rotate(p.swing?Math.sin(now/74)*1.1-.25:.1);
   shapeLine(c,[[0,5],[5,-14]],'#9d704c',4);
   c.textAlign='center';c.font='17px system-ui';c.fillText(TOOLS[p.tool||0].icon,5,-10);c.restore();
 }
 c.restore();
}
function avatar(p){
 const now=performance.now();
 const speaking=p===me?voiceActive:!!p.talking&&Date.now()-(p.voiceSeen||0)<1600;
 const inMine=(p===me?scene:p.scene)==='mine';
 ctx.save();ctx.translate(p.x,p.y);
 paintCharacter(ctx,inMine?{...p,inMine,tool:p===me?selectedTool:p.tool,swing:p===me?now<rockSwingUntil:p.swing}:p,now,speaking);
 ctx.restore();
 ctx.textAlign='center';ctx.font='bold 12px system-ui';
 const name=cleanName(p.name);
 const width=Math.max(44,ctx.measureText(name).width+19);
 rect(p.x-width/2,p.y-64,width,17,7,p===me?'#fff2cfea':'#fffff0ea');
 ctx.fillStyle='#33433e';ctx.fillText(name,p.x,p.y-52);
 if(speaking){
   circle(p.x+width/2+10,p.y-55,8,'#3a9f82');
   ctx.font='10px system-ui';ctx.fillText('🎙️',p.x+width/2+10,p.y-51);
 }
 if(!p.text||p.until<=Date.now())return;
 ctx.font='bold 13px system-ui';
 const lines=[];let line='';
 for(const char of p.text){
   if(ctx.measureText(line+char).width>204){lines.push(line);line=''}
   line+=char;
 }
 if(line)lines.push(line);
 const visible=lines.slice(0,4),bubbleWidth=Math.max(60,...visible.map(t=>ctx.measureText(t).width+22));
 const height=visible.length*19+10,bx=p.x-bubbleWidth/2,by=p.y-75-height;
 rect(bx+1,by+2,bubbleWidth,height,9,'#172a3740');
 rect(bx,by,bubbleWidth,height,9,'#fff8e9');
 ctx.fillStyle='#273b37';
 visible.forEach((t,index)=>ctx.fillText(t,p.x,by+18+index*19));
}

const characterDialog=document.createElement('dialog');
characterDialog.id='characterDialog';
characterDialog.className='character-card';
characterDialog.setAttribute('aria-labelledby','characterTitle');
characterDialog.innerHTML=`
 <form id="characterForm">
   <header>
     <h2 id="characterTitle">สร้างตัวละคร</h2>
     <button type="button" id="cancelCharacter" hidden>ยกเลิก</button>
   </header>
   <div class="character-layout">
     <div class="character-preview"><canvas id="characterPreview" width="256" height="282" aria-label="ตัวอย่างตัวละคร"></canvas></div>
     <div class="character-fields">
       <fieldset id="characterGender"><legend>เพศ</legend></fieldset>
       <div class="character-options" id="characterOptions"></div>
     </div>
   </div>
   <button id="saveCharacter" class="character-submit" type="submit">เริ่มเล่น</button>
 </form>`;
document.body.append(characterDialog);
const characterButton=document.createElement('button');
characterButton.id='editCharacter';
characterButton.type='button';
characterButton.textContent='👤 แต่งตัว';
characterButton.title='แต่งตัวละคร';
$('bag').after(characterButton);
const characterStorage='thai2d_appearance_v5';
try{
 const stored=JSON.parse(localStorage.getItem(characterStorage)||'null');
 if(Number.isInteger(stored?.gender)&&appearanceOptions.gender[stored.gender])me.appearance=cleanAppearance(stored);
}catch{}
const characterForm=$('characterForm');
const genderFields=$('characterGender');
for(const [index,gender] of appearanceOptions.gender.entries()){
 const label=document.createElement('label');
 const radio=document.createElement('input');
 radio.type='radio';radio.required=true;radio.name='gender';radio.value=index;
 const text=document.createElement('span');text.textContent=gender;
 label.append(radio,text);genderFields.append(label);
}
const fieldNames={skin:'สีผิว',hair:'สีผม',style:'ทรงผม',outfit:'ชุด',accessory:'เครื่องประดับ'};
for(const [key,title] of Object.entries(fieldNames)){
 const label=document.createElement('label');
 label.textContent=title;
 const select=document.createElement('select');
 select.name=key;
 for(const [index,name] of appearanceOptions[key].entries()){
   const option=document.createElement('option');option.textContent=name;option.value=index;select.append(option);
 }
 label.append(select);$('characterOptions').append(label);
}
function readCharacterForm(){
 const values=Object.fromEntries([...new FormData(characterForm)].map(([key,value])=>[key,Number(value)]));
 return cleanAppearance(values);
}
function updateCharacterPreview(){
 const canvas=$('characterPreview'),preview=canvas.getContext('2d');
 if(!preview)return;
 preview.clearRect(0,0,canvas.width,canvas.height);
 preview.save();preview.translate(canvas.width/2,canvas.height*.66);preview.scale(3.5,3.5);
 paintCharacter(preview,{face:Math.PI/2,appearance:readCharacterForm()},700);
 preview.restore();
}
function editCharacter(){
 const fields=characterForm.elements;
 fields.namedItem('gender').value=me.appearance?.gender??'';
 const appearance=me.appearance||baseAppearance;
 for(const key of Object.keys(fieldNames))fields.namedItem(key).value=appearance[key];
 $('characterTitle').textContent=me.appearance?'แต่งตัวละคร':'สร้างตัวละคร';
 $('cancelCharacter').hidden=!me.appearance;
 $('saveCharacter').textContent=me.appearance?'บันทึกตัวละคร':'เริ่มเล่น';
 keys.clear();
 characterDialog.showModal();
 updateCharacterPreview();
}
characterForm.addEventListener('change',updateCharacterPreview);
characterForm.addEventListener('submit',event=>{
 event.preventDefault();
 if(!characterForm.elements.namedItem('gender').value)return;
 me.appearance=readCharacterForm();
 try{localStorage.setItem(characterStorage,JSON.stringify(me.appearance))}catch{}
 characterDialog.close();
 broadcast(snapshot());
});
characterDialog.addEventListener('cancel',event=>{if(!me.appearance)event.preventDefault()});
characterDialog.addEventListener('close',()=>keys.clear());
$('cancelCharacter').onclick=()=>characterDialog.close();
characterButton.onclick=()=>{if(!me.action&&!lifeDialog.open)editCharacter()};
if(!me.appearance)editCharacter();

if(initial){$('room').value=initial;initPeer(null,false)}
else{status();toast('ออกประตูด้านล่างบ้านเพื่อสำรวจย่าน')}
