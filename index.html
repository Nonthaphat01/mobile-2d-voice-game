<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let W=0,H=0,last=performance.now(),vx=0,vy=0,joyPointer=null;function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
const world={w:780,h:550},objects=[{x:125,y:95,w:130,h:68,t:'sofa'},{x:310,y:120,w:140,h:80,t:'table'},{x:570,y:95,w:105,h:105,t:'plant'},{x:120,y:370,w:120,h:75,t:'bed'},{x:555,y:370,w:115,h:70,t:'cabinet'},{x:475,y:120,w:65,h:65,t:'chair'}];const me={x:390,y:310,face:0,name:'ผู้เล่น',text:'',until:0,color:'#527bea',pose:'stand',furniture:null,walking:false,scene:'room',tool:0};const others=new Map(),connections=new Map(),calls=new Map(),incomingCalls=new Map(),audios=new Map();let peer=null,myId='',hostId='',roomCode='',isHost=false,localStream=null,recognition=null,recStop=false,speakerOn=true,analyser=null,audioCtx=null,frame=0,lastVoiceSignal=0,voiceActive=false;const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
function toast(t){$('toast').textContent=t}function status(){const n=1+others.size;$('count').textContent=roomCode?'ในห้อง '+n+' คน':'เล่นคนเดียว';$('state').textContent=roomCode?'ห้อง '+roomCode+(isHost?' (เจ้าของห้อง)':[...connections.values()].some(c=>c.open)?' • เชื่อมต่อแล้ว':' • กำลังเชื่อมต่อ...'):'ยังไม่ได้เข้าห้อง'}function color(id){let n=0;for(const c of id)n=(n*31+c.charCodeAt(0))>>>0;return ['#527bea','#e27a89','#6fbd84','#c49a55','#aa80d6','#61b7c2'][n%6]}
function cleanName(t){return String(t||'ผู้เล่น').trim().slice(0,14)||'ผู้เล่น'}function code(t){return String(t||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24)}function idForRoom(c){return 'thai2droom-'+c}function rand(){return Math.random().toString(36).slice(2,8)}

// MINE WORLD: Each new rock tile removed permanently expands the walkable cave.
const MINE={cols:40,rows:28,tile:40,entryX:19,entryY:13};
const TOOLS=[
 {name:'อีเต้อเริ่มต้น',icon:'⛏️',unlock:1,power:1,speed:1},
 {name:'ค้อนเหล็ก',icon:'🔨',unlock:3,power:2,speed:1.06},
 {name:'สว่านขุดแร่',icon:'⚙️',unlock:6,power:3,speed:1.65}
];
let scene='room',roomPosition={x:me.x,y:me.y},minePosition={x:(MINE.entryX+.5)*MINE.tile,y:(MINE.entryY+.5)*MINE.tile};
let miningLevel=1,miningXp=0,minedCount=0,hitCount=0,selectedTool=0,lastMineSwing=0,rockSwingUntil=0,rockSwingAt=0;
let mineBroken=new Set(),mineDamage=new Map(),mineEffects=[],mineView={scale:1,cx:0,cy:0};
const mineIndex=(x,y)=>y*MINE.cols+x;
const rockCell=id=>({x:id%MINE.cols,y:Math.floor(id/MINE.cols)});
function inMineBounds(x,y){return x>=1&&y>=1&&x<MINE.cols-1&&y<MINE.rows-1}
function startingGap(x,y){return x>=17&&x<=21&&y>=11&&y<=15}
function makeStartingGap(){for(let y=11;y<=15;y++)for(let x=17;x<=21;x++)mineBroken.add(mineIndex(x,y))}
makeStartingGap();
function rockVariant(x,y){return ((x*61+y*107+x*y*17)>>>0)%11}
function rockMaxHp(x,y){return 2+(rockVariant(x,y)%3)}
function threshold(lv){return Math.round(17+lv*11+lv*lv*2)}
function miningSpeed(){return (1+Math.min(2.6,(miningLevel-1)*.115))*TOOLS[selectedTool].speed}
function swingCooldown(){return Math.max(105,Math.round(660/miningSpeed()))}
function miningPower(){return TOOLS[selectedTool].power+Math.floor((miningLevel-1)/4)}
function loadMine(){try{let d=JSON.parse(localStorage.getItem('thai2d_mine_v3')||'{}');
 miningLevel=Math.max(1,Math.min(99,Number(d.level)||1));miningXp=Math.max(0,Number(d.xp)||0);
 minedCount=Math.max(0,Number(d.mined)||0);hitCount=Math.max(0,Number(d.hits)||0);
 for(const id of (Array.isArray(d.broken)?d.broken:[]).slice(0,1100)){
  const i=Number(id),p=rockCell(i);if(Number.isInteger(i)&&inMineBounds(p.x,p.y))mineBroken.add(i)
 }
 selectedTool=TOOLS[Number(d.tool)]?.unlock<=miningLevel?Number(d.tool):0;
 }catch(e){} }
function saveMine(){try{const broken=[...mineBroken].filter(i=>{const p=rockCell(i);return !startingGap(p.x,p.y)});
 localStorage.setItem('thai2d_mine_v3',JSON.stringify({level:miningLevel,xp:miningXp,mined:minedCount,hits:hitCount,broken,tool:selectedTool}));
 }catch(e){} }
function miningHud(){const max=threshold(miningLevel);$('mineLevel').textContent='⛏️ Lv. '+miningLevel;
 $('mineSpeed').textContent=miningSpeed().toFixed(1)+'×';$('mineXpBar').style.width=Math.min(100,100*miningXp/max)+'%';
 $('mineXpLabel').textContent='EXP '+miningXp+' / '+max+' • ทุบ '+hitCount+' ครั้ง';
 $('mineOre').textContent='🪨 หิน '+minedCount;$('mineHps').textContent='⚡ '+miningPower()+' / ครั้ง';
 $('mineToolName').textContent='ถือ: '+TOOLS[selectedTool].icon+' '+TOOLS[selectedTool].name;
 for(const button of document.querySelectorAll('[data-tool]')){const i=Number(button.dataset.tool);
  button.classList.toggle('equipped',selectedTool===i);button.classList.toggle('locked',miningLevel<TOOLS[i].unlock);
  button.querySelector('small').textContent=miningLevel<TOOLS[i].unlock?'Lv.'+TOOLS[i].unlock:String(i+1);
 }
}
function switchTool(i){if(!Number.isInteger(i)||!TOOLS[i])return;
 if(miningLevel<TOOLS[i].unlock)return toast('🔒 '+TOOLS[i].name+' ปลดล็อกที่เลเวล '+TOOLS[i].unlock);
 selectedTool=i;miningHud();saveMine();toast('ถืออาวุธ: '+TOOLS[i].icon+' '+TOOLS[i].name)}
function addMineExp(n){miningXp+=n;while(miningLevel<99&&miningXp>=threshold(miningLevel)){
 miningXp-=threshold(miningLevel);miningLevel++;
 mineEffects.push({x:me.x,y:me.y-38,stamp:performance.now(),text:'LEVEL UP! '+miningLevel,col:'#ffe681',big:true});
 toast('🎉 เลเวล '+miningLevel+'! ขุดเร็วขึ้น • พลัง '+miningPower());}
 miningHud()}
function mineSolidAt(x,y){const pad=14,t=MINE.tile;
 for(const px of [x-pad,x+pad])for(const py of [y-pad,y+pad]){
 const tx=Math.floor(px/t),ty=Math.floor(py/t);
 if(!inMineBounds(tx,ty)||!mineBroken.has(mineIndex(tx,ty)))return true;
 }return false}
function mineEnter(){if(scene==='mine')return;if(me.pose!=='stand')rise();roomPosition={x:me.x,y:me.y,scene};
 scene='mine';me.x=minePosition.x;me.y=minePosition.y;me.pose='stand';me.face=0;me.walking=false;
 document.body.classList.add('mine-mode');$('mineToggle').textContent='↩️ ออกจากเหมือง';
 miningHud();broadcast(snapshot());toast('⛏️ เลือกช่อง 1 แล้วหันเข้าหาหิน กด Space หรือ 💥 เพื่อขุด!')}
function mineExit(){if(scene!=='mine')return;stopMineHold();clearInterval(mineSpaceInterval);minePosition={x:me.x,y:me.y};scene=roomPosition.scene;
 me.x=roomPosition.x;me.y=roomPosition.y;me.face=0;me.walking=false;me.pose='stand';
 document.body.classList.remove('mine-mode');$('mineToggle').textContent='⛏️ ไปเหมือง';
 broadcast(snapshot());toast('ออกจากเหมืองแล้ว บันทึกความคืบหน้าเรียบร้อย')}

function lifeTick(now,dt){
 if(scene==='room'&&me.pose==='stand'&&Math.abs(me.x-390)<35&&me.y>499&&me.face>0.35&&me.face<2.8){
   setLifeScene('outside',390,183);
 }
 if(scene==='outside'){
   if(Math.abs(me.x-390)<34&&me.y<176&&me.face<-.35&&me.face>-2.8)setLifeScene('room',390,479);
   neighbors.forEach((npc,i)=>{
     npc.walking=npc!==lifeTarget||!lifeDialog.open;
     if(!npc.walking)return;
     npc.x=npc.homeX+Math.sin(now/4600+i)*41;
     npc.y=npc.homeY+Math.cos(now/5200+i)*16;
   });
 }
 changeNeed('fullness',-dt*(scene==='mine'?.12:.05));
 changeNeed('energy',dt*(me.pose==='sleep'?5:me.pose==='sit'?.65:scene==='mine'?-.15:-.06));
 changeNeed('mood',-dt*(life.needs.fullness<25?.24:.045));
 if(now-lastLifeUpdate>350){
   lastLifeUpdate=now;lifeHud();
 }
 const action=nearLife();
 $('interact').hidden=!action;
 if(action)$('interact').textContent=action.label+' (E)';
 if(now-lifeSaveTime>5000){lifeSaveTime=now;saveLife()}
}
function drawKitchen(o){
 const fridge=o.t==='fridge';
 rect(o.x,o.y,o.w,o.h,10,fridge?'#c9e4e1':'#415461');
 rect(o.x+5,o.y+5,o.w-10,o.h-10,7,fridge?'#e7f3ee':'#586b75');
 if(fridge){
   rect(o.x+4,o.y+21,o.w-8,2,1,'#89a6a4');
   rect(o.x+13,o.y+26,4,19,2,'#699393');
 }else{
   for(const x of [o.x+21,o.x+53]){
     circle(x,o.y+22,10,'#273746');circle(x,o.y+22,6,'#b57259');
     circle(x,o.y+42,3,'#d4cdbd');
   }
 }
 mapLabel(o.label,o.x+o.w/2,o.y+o.h+13);
}
function mapLabel(text,x,y,fill='#263831'){
 ctx.fillStyle=fill;ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(text,x,y);
}

 circle(x+19,y+10,3,'#f4ce78');
}

 ctx.clearRect(0,0,W,H);ctx.fillStyle='#182d28';ctx.fillRect(0,0,W,H);

 rect(0,0,780,550,18,'#7da966');
 rect(17,15,746,519,17,'#a9ca83');
 rect(17,232,746,80,0,'#53636b');
 rect(17,223,746,10,0,'#e1ce9e');rect(17,311,746,10,0,'#e1ce9e');
 for(let x=35;x<750;x+=49)rect(x,269,24,3,1,'#eac685');
 for(const [x,w] of [[145,24],[365,50],[606,24]])rect(x,147,w,76,4,'#d9c49b');
 rect(345,310,90,165,16,'#d9c49b');
 rect(86,361,155,90,34,'#559488');
 rect(94,369,139,74,30,'#72b3b3');
 for(let i=0;i<8;i++)rect(111+i*14,386+i%3*15,11,2,1,'#ade2d7');
 mapLabel('สวนชุมชน',390,463);
 for(const [x,y] of [[67,195],[270,163],[712,186],[60,469],[300,426],[468,453],[672,440],[718,371]]){
   circle(x+3,y+8,21,'#6d9a65');rect(x-4,y,8,21,3,'#896846');
   circle(x,y-7,20,'#4b875b');circle(x-7,y-14,13,'#6ba86a');
 }
 for(const h of houses){
   rect(h.x+5,h.y+9,h.w,h.h,10,'#678955');
   rect(h.x,h.y+27,h.w,h.h-27,7,h.wall);
   rect(h.x-7,h.y,h.w+14,38,9,h.roof);
   for(const dx of [22,h.w-49]){
     rect(h.x+dx,h.y+51,27,19,3,'#58919c');
     rect(h.x+dx+12,h.y+51,2,19,0,'#fff1d2');
   }
   drawDoor(h.x+h.w/2,h.y+h.h-24);
   mapLabel(h.label,h.x+h.w/2,h.y+24,'#fff9e9');
 }
 const people=[me,...neighbors,...[...others.values()].filter(p=>p.scene==='outside')];
 people.sort((a,b)=>a.y-b.y).forEach(avatar);
 ctx.restore();
}
function mapTransform(){
 const scale=Math.min((W-16)/world.w,(H-16)/world.h,1.25);
 ctx.translate((W-world.w*scale)/2,(H-world.h*scale)/2);ctx.scale(scale,scale);
}
loadLife();lifeHud();
$('bag').onclick=()=>openLife('bag');
$('lifeClose').onclick=()=>lifeDialog.close();
$('interact').onclick=lifeInteract;
lifeDialog.addEventListener('close',()=>{lifeMode='';lifeTarget=null;keys.clear()});
addEventListener('keydown',e=>{
 if(e.repeat||lifeDialog.open||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;
 const key=e.key.toLowerCase();
 if(key==='e'&&me.pose==='stand'&&!e.defaultPrevented){lifeInteract();e.preventDefault()}
 if(key==='i'){openLife('bag');e.preventDefault()}
});
addEventListener('pagehide',saveLife);
