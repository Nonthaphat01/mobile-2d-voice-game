<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#121b2a"><title>ห้องพูดคุย 2D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111b29;color:white;font-family:system-ui,'Noto Sans Thai',sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;background:#13243ad9;border:1px solid #ffffff22;border-radius:14px;padding:9px 13px;font-size:13px;pointer-events:none}.top b{font-size:15px}.joystick{position:fixed;left:24px;bottom:max(28px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff45;touch-action:none;display:grid;place-items:center;box-shadow:inset 0 0 25px #0004}.joystick:before{content:'✣';font-size:35px;color:#ffffff55}.stick{position:absolute;width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#6fe4ff,#3686e8);border:3px solid #d8f9ff;box-shadow:0 5px 18px #0008;transform:translate(0,0);pointer-events:none}.voice{position:fixed;right:22px;bottom:max(37px,env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;background:#25486d;border:3px solid #91b7d9;color:white;font-size:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}.voice.active{background:#d64a64;border-color:#ffbec9;box-shadow:0 0 0 8px #ff718a33}.voice:active{transform:scale(.96)}.wave{position:fixed;right:17px;bottom:max(140px,calc(env(safe-area-inset-bottom) + 104px));width:102px;height:42px;display:flex;align-items:center;justify-content:center;gap:4px;background:#142c46d9;border-radius:14px;border:1px solid #ffffff26}.bar{width:5px;height:5px;background:#6e91b3;border-radius:6px;transition:height 65ms linear,background 100ms}.wave.active .bar{background:#7ef5d0}.status{position:fixed;bottom:max(5px,env(safe-area-inset-bottom));right:15px;font-size:11px;color:#d7e6fa;text-shadow:0 1px 3px #000}.hint{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;background:#13243acc;padding:8px 10px;border-radius:12px;font-size:12px;max-width:160px;text-align:right;pointer-events:none}@media(max-width:380px){.joystick{width:130px;height:130px}.voice{width:80px;height:80px}.wave{bottom:130px}}
 .chatbox{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:5px;width:min(48vw,330px);z-index:3}.chatbox input{min-width:0;flex:1;border-radius:10px;border:1px solid #8da5c0;background:#172a40;color:white;padding:10px;font-size:14px;touch-action:manipulation;user-select:text}.chatbox button{border:0;border-radius:10px;background:#54b9aa;color:#102331;font-weight:bold;padding:9px}.notice{position:fixed;left:50%;top:65px;transform:translateX(-50%);width:min(90vw,460px);background:#402b35;color:#fff;border:1px solid #ffb0b0;border-radius:12px;padding:12px;z-index:5;font-size:13px;line-height:1.5;display:none;box-shadow:0 8px 25px #0008}.notice button{float:right;background:transparent;color:white;border:0;font-size:20px}.notice.show{display:block}@media(max-width:620px){.chatbox{bottom:190px;width:min(65vw,300px);left:50%}.chatbox input{padding:8px}} </style></head><body><canvas id="game"></canvas><div class="top"><b>🏠 ห้องพูดคุย 2D</b><div>จอยสติ๊กเดินได้ 360°</div></div><div class="hint" id="message">แตะ 🎤 เพื่อเปิดไมค์</div><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><div class="wave" id="wave" aria-label="ระดับเสียงไมโครโฟน"></div><button class="voice" id="mic" aria-label="เปิดหรือปิดไมโครโฟน">🎤</button><div class="status" id="status">ไมค์ปิด</div><form class="chatbox" id="chatForm"><input id="chatText" placeholder="พิมพ์ข้อความ..." maxlength="120" aria-label="ข้อความ"><button type="submit">ส่ง</button></form><div class="notice" id="notice"><button type="button" id="closeNotice">×</button><span id="noticeText"></span></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const room={w:780,h:550},player={x:390,y:360,r:15,face:0},objects=[{x:125,y:95,w:130,h:68,type:'sofa'},{x:310,y:120,w:140,h:80,type:'table'},{x:570,y:95,w:105,h:105,type:'plant'},{x:120,y:370,w:120,h:75,type:'bed'},{x:555,y:370,w:115,h:70,type:'cabinet'}];let vx=0,vy=0,last=performance.now(),speech='',speechUntil=0;const joy=document.getElementById('joy'),stick=document.getElementById('stick');let joyId=null;function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,limit=(r.width-66)/2,dist=Math.hypot(dx,dy),scale=dist>limit?limit/dist:1;let sx=dx*scale,sy=dy*scale;stick.style.transform=`translate(${sx}px,${sy}px)`;vx=sx/limit;vy=sy/limit}function joyReset(){joyId=null;vx=vy=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerdown',e=>{if(joyId!==null)return;joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>joy.addEventListener(t,e=>{if(e.pointerId===joyId)joyReset()}));const keys=new Set();addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){keys.add(e.key);e.preventDefault()}});addEventListener('keyup',e=>keys.delete(e.key));
function hit(x,y){if(x<40||y<40||x>room.w-40||y>room.h-40)return true;return objects.some(o=>x+player.r>o.x&&x-player.r<o.x+o.w&&y+player.r>o.y&&y-player.r<o.y+o.h)}function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function render(now){const dt=Math.min((now-last)/1000,.05);last=now;let dx=vx,dy=vy;if(keys.size){dx=Number(keys.has('ArrowRight')||keys.has('d'))-Number(keys.has('ArrowLeft')||keys.has('a'));dy=Number(keys.has('ArrowDown')||keys.has('s'))-Number(keys.has('ArrowUp')||keys.has('w'))}let len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}if(len>.08){player.face=Math.atan2(dy,dx);const nx=player.x+dx*175*dt,ny=player.y+dy*175*dt;if(!hit(nx,player.y))player.x=nx;if(!hit(player.x,ny))player.y=ny}ctx.clearRect(0,0,W,H);ctx.fillStyle='#142238';ctx.fillRect(0,0,W,H);const scale=Math.min((W-22)/room.w,(H-24)/room.h,1.25);const ox=(W-room.w*scale)/2,oy=(H-room.h*scale)/2;ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);roundRect(0,0,room.w,room.h,18,'#b5c6cb');roundRect(24,24,room.w-48,room.h-48,10,'#d9c6a7');ctx.strokeStyle='#c4ae8e';ctx.lineWidth=1;for(let x=45;x<room.w-40;x+=40){ctx.beginPath();ctx.moveTo(x,26);ctx.lineTo(x,room.h-26);ctx.stroke()}for(let y=45;y<room.h-40;y+=40){ctx.beginPath();ctx.moveTo(26,y);ctx.lineTo(room.w-26,y);ctx.stroke()}roundRect(280,215,220,210,20,'#a8c7b4');roundRect(287,222,206,196,15,'#bcd9c5');for(const o of objects){ctx.fillStyle='#0002';ctx.fillRect(o.x+5,o.y+7,o.w,o.h);const colors={sofa:'#507da1',table:'#9e6d46',plant:'#659a68',bed:'#c58d9b',cabinet:'#8e7663'};roundRect(o.x,o.y,o.w,o.h,12,colors[o.type]);if(o.type==='sofa'){roundRect(o.x+12,o.y+12,o.w-24,18,6,'#83a8c5');roundRect(o.x+14,o.y+37,44,22,5,'#aac8db');roundRect(o.x+70,o.y+37,44,22,5,'#aac8db')}if(o.type==='table'){roundRect(o.x+10,o.y+10,o.w-20,o.h-20,8,'#c89b67');ctx.fillStyle='#f4e2bc';ctx.beginPath();ctx.arc(o.x+o.w/2,o.y+o.h/2,16,0,7);ctx.fill()}if(o.type==='plant'){ctx.fillStyle='#427b4c';for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(o.x+o.w/2+Math.cos(i*2.4)*25,o.y+o.h/2+Math.sin(i*2.4)*25,22,0,7);ctx.fill()}}if(o.type==='bed'){roundRect(o.x+8,o.y+8,o.w-16,o.h-16,8,'#e7b9c4');roundRect(o.x+12,o.y+10,34,o.h-20,7,'#fff2e9')}if(o.type==='cabinet'){ctx.strokeStyle='#d4b79b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(o.x+o.w/2,o.y+8);ctx.lineTo(o.x+o.w/2,o.y+o.h-8);ctx.stroke()}}roundRect(355,room.h-35,70,18,3,'#8f6a4e');ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(player.x,player.y+12,17,8,0,0,7);ctx.fill();ctx.fillStyle='#426be2';ctx.beginPath();ctx.arc(player.x,player.y+3,player.r,0,7);ctx.fill();ctx.fillStyle='#f4c69d';ctx.beginPath();ctx.arc(player.x,player.y-7,11,0,7);ctx.fill();ctx.fillStyle='#253348';ctx.beginPath();ctx.arc(player.x+Math.cos(player.face)*5,player.y-7+Math.sin(player.face)*5,3,0,7);ctx.fill();roundRect(player.x-24,player.y-42,48,16,7,'#ffffffea');ctx.fillStyle='#1e3650';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('ผู้เล่น 1',player.x,player.y-30);if(speech&&now<speechUntil){ctx.font='bold 15px system-ui';const lines=[];let current='';for(const ch of speech){if(ctx.measureText(current+ch).width>240){lines.push(current);current=''}current+=ch}if(current)lines.push(current);const width=Math.min(270,Math.max(85,...lines.map(t=>ctx.measureText(t).width+24))),height=lines.length*21+16;const bx=Math.max(12,Math.min(room.w-width-12,player.x-width/2)),by=Math.max(43,player.y-58-height);roundRect(bx,by,width,height,12,'#fff');ctx.fillStyle='#253348';lines.forEach((t,i)=>ctx.fillText(t,bx+width/2,by+25+i*21))}ctx.restore();requestAnimationFrame(render)}requestAnimationFrame(render);
const wave=document.getElementById('wave'),bars=Array.from({length:11},()=>{let e=document.createElement('div');e.className='bar';wave.appendChild(e);return e}),mic=document.getElementById('mic'),status=document.getElementById('status'),message=document.getElementById('message');let stream=null,audioCtx=null,analyser=null,source=null,raf=0,recognition=null,active=false,stopping=false;const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;function setMsg(t){message.textContent=t}const notice=document.getElementById('notice'),noticeText=document.getElementById('noticeText');function showNotice(t){noticeText.textContent=t;notice.classList.add('show')}document.getElementById('closeNotice').onclick=()=>notice.classList.remove('show');document.getElementById('chatForm').addEventListener('submit',e=>{e.preventDefault();const field=document.getElementById('chatText'),t=field.value.trim();if(t){speech=t;speechUntil=performance.now()+6500;field.value='';field.blur();setMsg('แสดงข้อความแล้ว')}});function drawWave(){if(!active||!analyser)return;let data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);let sum=0;for(const v of data){let n=(v-128)/128;sum+=n*n}let level=Math.sqrt(sum/data.length);bars.forEach((b,i)=>{const shape=.4+.6*Math.abs(Math.sin(i*.7+performance.now()/190));b.style.height=Math.max(5,Math.min(36,5+level*240*shape))+'px'});status.textContent=level>.025?'🔊 กำลังรับเสียง':'🎤 ไมค์เปิด • รอเสียงพูด';raf=requestAnimationFrame(drawWave)}function stopMic(){active=false;stopping=true;cancelAnimationFrame(raf);try{recognition?.stop()}catch(e){}recognition=null;source?.disconnect();source=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}analyser=null;wave.classList.remove('active');mic.classList.remove('active');bars.forEach(b=>b.style.height='5px');status.textContent='ไมค์ปิด';setMsg('แตะ 🎤 เพื่อเปิดไมค์')}
async function startMic(){if(active)return;setMsg('กำลังขออนุญาตไมโครโฟน...');try{if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('insecure-context');const s=await navigator.mediaDevices.getUserMedia({audio:true});stream=s;audioCtx=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=1024;source.connect(analyser);active=true;stopping=false;wave.classList.add('active');mic.classList.add('active');setMsg('ไมค์เปิดแล้ว • ลองพูดได้เลย');drawWave();if(SpeechRecognition){const rec=new SpeechRecognition();recognition=rec;rec.lang='th-TH';rec.continuous=true;rec.interimResults=true;rec.onresult=e=>{let interim='',final='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else interim+=t}const text=(final||interim).trim();if(text){speech=text.slice(-120);speechUntil=performance.now()+6500;setMsg('แปลงเสียงเป็นข้อความแล้ว')}};rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){setMsg('ระบบแปลงเสียงไม่ได้รับอนุญาต');showNotice('ระบบรู้จำเสียงไม่ได้รับอนุญาต ลองเปิดด้วย Chrome ผ่าน HTTPS และตรวจสอบสิทธิ์ไมโครโฟน หรือใช้ช่องพิมพ์ข้อความแทน');return}if(e.error==='no-speech')return;setMsg('ระบบรู้จำเสียง: '+e.error)};rec.onend=()=>{if(active&&!stopping&&recognition===rec){try{rec.start()}catch(e){}}};try{rec.start()}catch(e){setMsg('ไมค์ทำงาน แต่ระบบแปลงเสียงไม่พร้อม')}}else setMsg('คลื่นเสียงทำงาน แต่เบราว์เซอร์ไม่รองรับแปลงคำพูด')}catch(e){stopMic();const insecure=e.message==='insecure-context';const denied=e.name==='NotAllowedError'||e.name==='PermissionDeniedError';const t=insecure?'ไฟล์ HTML ที่เปิดโดยตรงอาจไม่รองรับไมโครโฟน กรุณาอัปโหลดเกมไปยังเว็บ HTTPS เช่น GitHub Pages หรือ Netlify แล้วเปิดด้วย Chrome':denied?'เบราว์เซอร์ไม่อนุญาตใช้ไมค์: ไปที่การตั้งค่า Android > แอป > Chrome > สิทธิ์ > ไมโครโฟน และอนุญาต จากนั้นตรวจสอบสิทธิ์เว็บไซต์ใน Chrome':('ไมค์ไม่พร้อม: '+(e.message||e.name)+' ตรวจสอบว่าไม่มีแอปอื่นใช้ไมค์อยู่');setMsg('⚠️ ไมค์ไม่พร้อม • ใช้ช่องพิมพ์ได้');showNotice(t)}}mic.addEventListener('click',()=>active?stopMic():startMic());addEventListener('pagehide',()=>{if(active)stopMic()});
</script></body></html>
